[project]
name = "tensor-engine"
version = "0.1.0"
description = "A from-scratch tensor autograd engine, built as a learning project."
requires-python = ">=3.9"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tensor_engine*"]